resources:
  jobs:
    sales_etl_job:
      name: sales_etl_job

      tasks:
        - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../src/01_bronze_ingestion.py
            base_parameters:
              source_path: "/Volumes/workspace/default/raw_data/sales_source_1500.csv"
          environment_key: default

        - task_key: data_quality
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../src/00_data_quality_report.py
          environment_key: default

        - task_key: silver_cleaning
          depends_on:
            - task_key: data_quality
          notebook_task:
            notebook_path: ../src/02_silver_cleaning.py
          environment_key: default

        - task_key: gold_analytics
          depends_on:
            - task_key: silver_cleaning
          notebook_task:
            notebook_path: ../src/03_gold_analytics.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "1"
